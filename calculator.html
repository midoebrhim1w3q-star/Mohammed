<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111827, #1f2937);
      padding: 20px;
    }

    .calculator {
      width: 100%;
      max-width: 360px;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .title {
      color: #e5e7eb;
      text-align: center;
      margin-bottom: 15px;
      font-size: 24px;
      font-weight: bold;
    }

    .display {
      width: 100%;
      height: 70px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 16px;
      padding: 15px;
      font-size: 28px;
      text-align: right;
      margin-bottom: 15px;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 65px;
      border: none;
      border-radius: 16px;
      font-size: 22px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.03);
    }

    .num {
      background: #1e293b;
      color: white;
    }

    .op {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
    }

    .clear {
      background: #f87171;
      color: white;
    }

    .equal {
      background: #22c55e;
      color: white;
      grid-column: span 2;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="title">Calculator</div>
    <input type="text" class="display" id="display" readonly />
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="op" onclick="appendValue('/')">/</button>
      <button class="op" onclick="appendValue('*')">*</button>
      <button class="op" onclick="deleteLast()">DEL</button>

      <button class="num" onclick="appendValue('7')">7</button>
      <button class="num" onclick="appendValue('8')">8</button>
      <button class="num" onclick="appendValue('9')">9</button>
      <button class="op" onclick="appendValue('-')">-</button>

      <button class="num" onclick="appendValue('4')">4</button>
      <button class="num" onclick="appendValue('5')">5</button>
      <button class="num" onclick="appendValue('6')">6</button>
      <button class="op" onclick="appendValue('+')">+</button>

      <button class="num" onclick="appendValue('1')">1</button>
      <button class="num" onclick="appendValue('2')">2</button>
      <button class="num" onclick="appendValue('3')">3</button>
      <button class="equal" onclick="calculateResult()">=</button>

      <button class="num zero" onclick="appendValue('0')">0</button>
      <button class="num" onclick="appendValue('.')">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    function calculateResult() {
      try {
        display.value = eval(display.value);
      } catch (error) {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
